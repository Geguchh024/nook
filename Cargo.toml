[workspace]
resolver = "3"
members = ["crates/app", "crates/ui", "crates/platform", "crates/modules"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
windows = "0.62"
tray-icon = "0.26"
global-hotkey = "0.9"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
crossbeam-channel = "0.5"

nook-ui = { path = "crates/ui" }
nook-platform = { path = "crates/platform" }
nook-modules = { path = "crates/modules" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
