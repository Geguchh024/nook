name: Build Windows installer

# Builds nook.exe and the Setup wizard (installer/nook.iss via build.ps1).
# Download: Actions -> run -> Artifacts. A tag like v0.3.1 additionally
# publishes dist/Nook-Setup-<version>.exe as a GitHub release, which is
# what the in-app updater looks for.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # Informational: a failure here does not block the installer.
      - name: Clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets
      - name: Tests
        continue-on-error: true
        run: cargo test --workspace

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: Nook-Setup
          path: |
            dist/Nook-Setup-*.exe
            target/release/nook.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Nook-Setup-*.exe
